<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="chart-visitors-t chart-visitors-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="chart-visitors-t">Visitors to three attractions in Lakeford, 2000 to 2020</title>
<desc id="chart-visitors-d">Line graph, annual visitors in thousands. Museum: 120 in 2000, 135 in 2005, 150 in 2010, 140 in 2015, 160 in 2020. Zoo: 200, 190, 170, 155, 145. Aquarium: 40, 55, 90, 120, 175. The aquarium overtakes both the museum and the zoo between 2015 and 2020.</desc>
