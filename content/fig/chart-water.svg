<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="chart-water-t chart-water-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="chart-water-t">Daily water use per person in Eastvale, 2000, 2010 and 2020</title>
<desc id="chart-water-d">Table, average litres per person per day. Showers and baths: 60 in 2000, 55 in 2010, 48 in 2020. Toilet flushing: 45, 35, 28. Washing machines: 25, 20, 18. Garden watering: 20, 26, 30. Drinking and cooking: 10, 10, 11. Total: 160, 146, 135.</desc>
