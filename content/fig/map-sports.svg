<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-sports-t map-sports-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-sports-t">Floor plan of a sports centre</title>
<desc id="map-sports-d">The entrance is on the west side, near the bottom. Reception is just inside the entrance. A corridor runs from west to east across the building, above reception. The swimming pool fills the north-west part of the building, north of the corridor. Letter A is north of the corridor, just east of the pool, at the top. Letter B is in the north-east corner. Letter C is north of the corridor, just east of the pool, near the corridor. Letter D is north of the corridor at the east end, near the corridor. Letter E is south of the corridor, immediately east of reception. Letter F is south of the corridor, in the middle of the south part. Letter G is in the south-east corner. Letter H is directly south of reception, near the south wall.</desc>
<path d="M372 44 L372 20 M367 26 L372 20 L377 26"/><text x="372" y="58" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">N</text><rect x="10" y="10" width="340" height="270"/><rect x="20" y="20" width="170" height="120" fill="currentColor" fill-opacity=".10"/><text x="105" y="85" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">swimming pool</text><rect x="2" y="190" width="10" height="30" fill="Canvas"/><text x="16" y="182" text-anchor="start" fill="currentColor" stroke="none" font-size="11">entrance</text><rect x="60" y="180" width="70" height="40"/><text x="95" y="205" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">reception</text><line x1="10" y1="160" x2="350" y2="160" stroke-dasharray="6 4" stroke-width="1"/><circle cx="255" cy="50" r="11" fill="Canvas"/><text x="255" y="54.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="320" cy="50" r="11" fill="Canvas"/><text x="320" y="54.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">B</text><circle cx="255" cy="120" r="11" fill="Canvas"/><text x="255" y="124.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="320" cy="120" r="11" fill="Canvas"/><text x="320" y="124.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">D</text><circle cx="170" cy="200" r="11" fill="Canvas"/><text x="170" y="204.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">E</text><circle cx="240" cy="230" r="11" fill="Canvas"/><text x="240" y="234.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text><circle cx="320" cy="230" r="11" fill="Canvas"/><text x="320" y="234.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="95" cy="260" r="11" fill="Canvas"/><text x="95" y="264.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
