<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-museum-t map-museum-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-museum-t">Ground floor plan of a museum</title>
<desc id="map-museum-d">A rectangular building with the entrance on the west side, leading into a corridor that runs east across the middle of the building. There are three rooms north of the corridor and three rooms south of it. Letter A is the first room on the north side, nearest the entrance. Letter B is the middle room on the north side. Letter C is the room in the north-east corner, which contains the stairs. Letter D is the first room on the south side, nearest the entrance. Letter E is the middle room on the south side. Letter F is the room in the south-east corner. Letter G is a small area in the corridor itself, roughly in the middle. Letter H is at the far east end of the corridor.</desc>
