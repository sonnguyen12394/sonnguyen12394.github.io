dle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="330" cy="155" r="11" fill="Canvas"/><text x="330" y="159.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
</svg>
