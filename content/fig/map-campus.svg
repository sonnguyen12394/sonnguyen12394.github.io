<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-campus-t map-campus-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-campus-t">Map of a university campus</title>
<desc id="map-campus-d">A campus with College Road running from west to east across the middle; the bus stop is at the west end of the road. A path leaves College Road at its midpoint and runs south. The library is north of College Road, in the centre. Letter A is north of the road, west of the library. Letter B is north of the road, east of the library, near the top. Letter C is north of the road, east of the library, just beside the road. Letter D is south of the road, west of the path, near the road. Letter E is south of the road, east of the path, near the road. Letter F is at the south end of the path, on its west side. Letter G is at the south end of the path, on its east side. Letter H is south of the road at its far east end.</desc>
<path d="M372 44 L372 20 M367 26 L372 20 L377 26"/><text x="372" y="58" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">N</text><rect x="10" y="10" width="340" height="270" rx="6"/><path d="M10 150 H350" stroke-width="10" stroke-opacity=".25"/><text x="60" y="140" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">College Road</text><path d="M180 150 V280" stroke-width="8" stroke-opacity=".25"/><rect x="140" y="40" width="80" height="50"/><text x="180" y="70" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">library</text><rect x="2" y="140" width="10" height="20" fill="Canvas"/><text x="16" y="175" text-anchor="start" fill="currentColor" stroke="none" font-size="11">bus stop</text><circle cx="70" cy="70" r="11" fill="Canvas"/><text x="70" y="74.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="270" cy="60" r="11" fill="Canvas"/><text x="270" y="64.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">B</text><circle cx="250" cy="120" r="11" fill="Canvas"/><text x="250" y="124.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="110" cy="200" r="11" fill="Canvas"/><text x="110" y="204.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">D</text><circle cx="250" cy="200" r="11" fill="Canvas"/><text x="250" y="204.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">E</text><circle cx="110" cy="260" r="11" fill="Canvas"/><text x="110" y="264.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text><circle cx="250" cy="260" r="11" fill="Canvas"/><text x="250" y="264.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="330" cy="190" r="11" fill="Canvas"/><text x="330" y="194.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
</svg>
