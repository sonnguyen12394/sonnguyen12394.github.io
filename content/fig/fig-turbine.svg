<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-labelledby="fig-turbine-t fig-turbine-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-turbine-t">Diagram of a wind turbine</title>
<desc id="fig-turbine-d">A tall column standing on a foundation, with a long housing on top. Number 1 is one of the three long thin parts at the front. Number 2 is the round centre point where these three parts meet. Number 3 is the long housing on top of the column. Inside the housing are two small boxes: number 4 is the front box, close to the centre point, and the box behind it is labelled generator. Number 5 is the tall column itself.</desc>
