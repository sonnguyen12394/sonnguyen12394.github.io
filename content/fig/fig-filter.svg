<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-labelledby="fig-filter-t fig-filter-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-filter-t">Diagram of a home-made water filter</title>
<desc id="fig-filter-d">A plastic bottle with its bottom cut off, turned upside down, with its neck pointing down. Inside are four layers. Number 1 is the top layer, a thin wavy sheet across the opening. Number 2 is the second layer, made of tiny grains. Number 3 is the third layer, shown dark grey. Number 4 is the bottom layer, made of small round stones. Number 5 is the small screw-on part closing the neck, with a tiny hole through which water drips into a bucket below.</desc>
