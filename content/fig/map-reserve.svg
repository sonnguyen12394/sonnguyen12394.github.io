ntColor" stroke="none" font-weight="700">D</text><circle cx="285" cy="50" r="11" fill="Canvas"/><text x="285" y="54.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="280" cy="180" r="11" fill="Canvas"/><text x="280" y="184.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="55" cy="75" r="11" fill="Canvas"/><text x="55" y="79.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text>
