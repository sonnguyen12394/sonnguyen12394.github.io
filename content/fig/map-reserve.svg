<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-reserve-t map-reserve-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-reserve-t">Map of Hollins Marsh nature reserve</title>
<desc id="map-reserve-d">The car park is in the south-west corner of the reserve. A path runs east from the car park and then north to the visitor centre in the middle of the reserve. A lake called the mere lies in the north-east, and a short boardwalk runs east from the visitor centre towards the mere. Woodland covers the north-west corner. Letter A is south of the mere, east of the visitor centre. Letter B is immediately west of the visitor centre. Letter C is on the north shore of the mere. Letter D is at the eastern end of the boardwalk, on the west shore of the mere. Letter E is beside the path, just before it turns north, west of the path. Letter F is in the woodland. Letter G is immediately north of the visitor centre. Letter H is south of the path, just east of the car park.</desc>
