<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-town-t map-town-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-town-t">Map of a town centre</title>
<desc id="map-town-d">Two streets run from west to east: High Street in the north and Mill Lane in the south. Church Road runs from north to south and crosses both. The station is at the west end of High Street. The market is on the east side of Church Road, between High Street and Mill Lane. Letter A is north of High Street, west of Church Road. Letter B is north of High Street, east of Church Road. Letter C is east of the market, between the two streets. Letter D is between the two streets, west of Church Road and away from the corner. Letter E is between the two streets, right on the west side of Church Road, opposite the market. Letter F is south of Mill Lane, west of Church Road. Letter G is south of Mill Lane, just east of Church Road. Letter H is south of Mill Lane at its east end.</desc>
<path d="M372 44 L372 20 M367 26 L372 20 L377 26"/><text x="372" y="58" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">N</text><rect x="10" y="10" width="340" height="270"/><path d="M10 100 H350 M10 200 H350" stroke-width="10" stroke-opacity=".25"/><text x="70" y="92" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">High Street</text><text x="60" y="192" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">Mill Lane</text><path d="M200 10 V280" stroke-width="10" stroke-opacity=".25"/><text x="214" y="30" text-anchor="start" fill="currentColor" stroke="none" font-size="11">Church Road</text><rect x="215" y="115" width="60" height="70" fill="currentColor" fill-opacity=".12"/><text x="245" y="155" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">market</text><rect x="2" y="90" width="10" height="20" fill="Canvas"/><text x="16" y="125" text-anchor="start" fill="currentColor" stroke="none" font-size="11">station</text><circle cx="100" cy="55" r="11" fill="Canvas"/><text x="100" y="59.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="260" cy="55" r="11" fill="Canvas"/><text x="260" y="59.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">B</text><circle cx="320" cy="135" r="11" fill="Canvas"/><text x="320" y="139.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="100" cy="145" r="11" fill="Canvas"/><text x="100" y="149.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">D</text><circle cx="175" cy="150" r="11" fill="Canvas"/><text x="175" y="154.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">E</text><circle cx="100" cy="240" r="11" fill="Canvas"/><text x="100" y="244.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text><circle cx="260" cy="240" r="11" fill="Canvas"/><text x="260" y="244.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="320" cy="240" r="11" fill="Canvas"/><text x="320" y="244.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
</svg>
