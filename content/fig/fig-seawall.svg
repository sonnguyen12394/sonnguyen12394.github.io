<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="fig-seawall-t fig-seawall-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-seawall-t">Cross-section of the new sea wall at Brenmouth</title>
<desc id="fig-seawall-d">A cross-section from the sea on the left to the land on the right. Number 14 points to a sloping bank on the seaward side, at the foot of the wall. Number 15 points to the seaward face of the wall, which rises from the bank in a series of small level stages. Number 16 points to the curved top edge of the wall, which bends back towards the sea. Number 17 points to the flat surface on top of the wall, on the land side. Number 18 points to a small channel just below that flat surface, on the land side.</desc>
