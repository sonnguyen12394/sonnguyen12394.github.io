<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 305" role="img" aria-labelledby="map-farm-t map-farm-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-farm-t">Map of a farm visitor area</title>
<desc id="map-farm-d">A visitor centre stands in the middle, with the car park to the south and a path between them. A stream runs down the west edge of the area. Letter A is directly north of the visitor centre. Letter B is in the north-east corner. Letter C is east of the visitor centre. Letter D is in the south-east corner. Letter E is south-west of the visitor centre, near the car park. Letter F is west of the visitor centre, between it and the stream. Letter G is in the north-west, near the stream. Letter H is just south-east of the visitor centre, close to its corner.</desc>
<path d="M372 44 L372 20 M367 26 L372 20 L377 26"/><text x="372" y="58" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">N</text><rect x="10" y="10" width="340" height="270" rx="6"/><rect x="130" y="110" width="100" height="70"/><text x="180" y="150" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">visitor centre</text><path d="M180 280 V180" stroke-width="1" stroke-dasharray="4 3"/><text x="180" y="296" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">car park</text><path d="M40 30 Q60 140 30 270" stroke-width="3" stroke-opacity=".4"/><text x="58" y="285" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">stream</text><circle cx="180" cy="70" r="11" fill="Canvas"/><text x="180" y="74.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="290" cy="60" r="11" fill="Canvas"/><text x="290" y="64.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">B</text><circle cx="290" cy="145" r="11" fill="Canvas"/><text x="290" y="149.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="290" cy="235" r="11" fill="Canvas"/><text x="290" y="239.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">D</text><circle cx="110" cy="240" r="11" fill="Canvas"/><text x="110" y="244.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">E</text><circle cx="90" cy="145" r="11" fill="Canvas"/><text x="90" y="149.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text><circle cx="90" cy="55" r="11" fill="Canvas"/><text x="90" y="59.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="245" cy="200" r="11" fill="Canvas"/><text x="245" y="204.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
