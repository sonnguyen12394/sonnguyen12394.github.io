<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-labelledby="fig-solar-t fig-solar-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-solar-t">Diagram of a solar water heater</title>
<desc id="fig-solar-d">On the left, a flat sloping panel sits on a roof facing the sun; number 1 is this panel. Number 2 is the upper pipe, running from the top of the panel up to a tank on the right. The tank has a dashed line drawn just inside its wall; number 3 is this inner layer. Number 4 is the pipe leaving the top right of the tank. Number 5 is the lower curved pipe, running from the bottom of the tank back to the bottom of the panel. A pipe at the bottom right of the tank is labelled cold water in.</desc>
