<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" role="img" aria-labelledby="map-park-t map-park-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="map-park-t">Map of Greenfield Park</title>
<desc id="map-park-d">A rectangular park with the main gate in the middle of the south side. A main path runs straight north from the gate. A lake lies east of the path in the middle of the park. Letter A is just inside the gate, west of the path. Letter B is just inside the gate, east of the path. Letter C is west of the path, halfway up the park. Letter D is on the north shore of the lake. Letter E is in the north-west corner. Letter F is in the north-east corner. Letter G is between the path and the lake, just south of the lake. Letter H is west of the path, near the north end.</desc>
<path d="M372 44 L372 20 M367 26 L372 20 L377 26"/><text x="372" y="58" text-anchor="middle" fill="currentColor" stroke="none" font-size="11">N</text><rect x="10" y="10" width="340" height="270" rx="8"/><path d="M170 280 V20 M178 280 V20" stroke-width="1"/><ellipse cx="265" cy="150" rx="55" ry="35" fill="currentColor" fill-opacity=".12"/><text x="265" y="154" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">lake</text><rect x="160" y="276" width="28" height="12" fill="Canvas"/><text x="174" y="298" text-anchor="middle" fill="currentColor" stroke="none" font-size="12">main gate</text><circle cx="120" cy="250" r="11" fill="Canvas"/><text x="120" y="254.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text><circle cx="225" cy="250" r="11" fill="Canvas"/><text x="225" y="254.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">B</text><circle cx="100" cy="160" r="11" fill="Canvas"/><text x="100" y="164.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">C</text><circle cx="265" cy="85" r="11" fill="Canvas"/><text x="265" y="89.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">D</text><circle cx="60" cy="50" r="11" fill="Canvas"/><text x="60" y="54.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">E</text><circle cx="320" cy="45" r="11" fill="Canvas"/><text x="320" y="49.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">F</text><circle cx="235" cy="205" r="11" fill="Canvas"/><text x="235" y="209.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">G</text><circle cx="130" cy="95" r="11" fill="Canvas"/><text x="130" y="99.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">H</text>
