<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="fig-earth-t fig-earth-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-earth-t">Cross-section of the Earth</title>
<desc id="fig-earth-d">Half of the Earth cut open showing layers. A thin outer layer numbered 1, a thick layer below it numbered 2 with curved arrows numbered 5 showing slow movement, a layer numbered 3 around the centre, and a solid centre numbered 4.</desc>
