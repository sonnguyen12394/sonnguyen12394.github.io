<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 285" role="img" aria-labelledby="fig-wheel-t fig-wheel-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-wheel-t">Diagram of a water mill</title>
<desc id="fig-wheel-d">A large wheel with small containers around its edge. Water arrives from the left along a channel at the top, numbered 1. A barrier across this channel is numbered 2. The containers on the edge of the wheel are numbered 3. Number 4 is the long rod that runs from the centre of the wheel to the right, through the wall into the mill building, where it ends at a small round part. Number 5 is the large flat round stone inside the building, above the end of the rod.</desc>
