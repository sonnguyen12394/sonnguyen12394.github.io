<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 280" role="img" aria-labelledby="fig-volcano-t fig-volcano-d" font-family="system-ui, sans-serif" font-size="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
<title id="fig-volcano-t">Cross-section of a volcano</title>
<desc id="fig-volcano-d">A cone-shaped mountain cut in half. Deep below is a large area numbered 1. A long channel numbered 2 rises from it to an opening at the top numbered 3, above which is a cloud numbered 4. A smaller branch numbered 5 leads to the side of the mountain, where lava flows out.</desc>
